    <rect x="550" y="130" width="190" height="110" fill="#eaf4ef" stroke="#9cc9b1"/><text x="645" y="169" text-anchor="middle" font-size="12" fill="#4f7962">VERIFY</text><text x="645" y="199" text-anchor="middle" font-size="18" font-weight="700" fill="#225d43">Hashes + signature</text>
