<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <rect width="1100" height="360" fill="#f5f7f8"/>
  <text x="50" y="54" font-family="Arial" font-size="25" font-weight="700" fill="#18232b">Signed release trust flow</text>
  <text x="50" y="82" font-family="Arial" font-size="13" fill="#687681">A generic demonstration with locally generated keys and disposable packages</text>
