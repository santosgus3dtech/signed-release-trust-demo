[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-release-trust-demo"
version = "1.0.0"
description = "Ed25519 release signing, verified install, rollback and device lease demo"
requires-python = ">=3.10"
dependencies = ["cryptography>=43,<47"]

[project.scripts]
trust-demo = "trustdemo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
